# HRA 项目 Docker Compose（D10 2.1）
# 生产环境：postgres/redis 改用阿里云 RDS/Redis 托管（注释段说明）
# 本地开发：使用 postgres/redis 镜像

services:
  # ===== 反向代理 =====
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - api
    networks:
      - hra-net
    restart: unless-stopped

  # ===== 数据库迁移（one-shot：alembic upgrade head 后退出） =====
  # api/worker/beat 依赖其成功完成后再启动，保证 schema 先行
  migrate:
    build: ./backend
    command: alembic upgrade head
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://hra:${POSTGRES_PASSWORD:-hra}@postgres:5432/hra
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hra-net
    restart: "no"

  # ===== API 网关（FastAPI） =====
  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://hra:${POSTGRES_PASSWORD:-hra}@postgres:5432/hra
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # 仅绑定本机回环（安全修复）：8000 不直接对外暴露，统一经 nginx 入口，
      # 同时防止绕过反代直连后端伪造 X-Forwarded-For 绕过登录限流
      - "127.0.0.1:8000:8000"
    networks:
      - hra-net
    restart: unless-stopped

  # ===== Celery Worker（异步任务） =====
  worker:
    build: ./backend
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://hra:${POSTGRES_PASSWORD:-hra}@postgres:5432/hra
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - hra-net
    restart: unless-stopped

  # ===== Celery Beat（定时调度：漂移检测/公平性日报） =====
  beat:
    build: ./backend
    command: celery -A app.celery_app beat --loglevel=info
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://hra:${POSTGRES_PASSWORD:-hra}@postgres:5432/hra
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - hra-net
    restart: unless-stopped

  # ===== PostgreSQL 15 + pgvector（本地开发镜像，feat/rag-kb）
  # 生产环境改用阿里云 RDS PostgreSQL 15 高可用版（需自行创建 pgvector 扩展）
  # 配置：shared_buffers=2GB / work_mem=64MB / max_connections=200
  # 主从：流复制（异步）+ WAL 归档至 OSS
  # 注意：host 端口 5433/6380 避免与本地已装 PG(5432)/Redis(6379) 冲突
  postgres:
    # feat/rag-kb：pgvector 扩展内置镜像（迁移 0003 会 CREATE EXTENSION vector）
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hra}
      POSTGRES_DB: ${POSTGRES_DB:-hra}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hra}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hra-net
    restart: unless-stopped

  # ===== Redis 7（本地开发镜像）
  # 生产环境改用阿里云 Redis 7 托管主备版 + Sentinel
  # 持久化：RDB（每 5min）+ AOF（每秒 fsync）+ LRU 淘汰
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --save 300 1
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hra-net
    restart: unless-stopped

  # ===== Prometheus（指标采集，D03 7.1） =====
  prometheus:
    image: prom/prometheus:v2.55.0
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - hra-net
    restart: unless-stopped

  # ===== Grafana（可视化，D03 7.1） =====
  grafana:
    image: grafana/grafana:11.5.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
        required: false
    networks:
      - hra-net
    restart: unless-stopped

  # ===== Loki（日志聚合，D03 7.1） =====
  loki:
    image: grafana/loki:3.0
    profiles: ["logging"]
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
    networks:
      - hra-net
    restart: unless-stopped

  # ===== Promtail（日志采集，D03 7.1） =====
  promtail:
    image: grafana/promtail:3.0
    profiles: ["logging"]
    volumes:
      - /var/log:/var/log:ro
      # promtail.yml 使用 docker_sd_configs 发现容器日志，必须挂载 docker.sock（只读）
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./monitoring/promtail.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - hra-net
    restart: unless-stopped

networks:
  hra-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
  loki-data:
