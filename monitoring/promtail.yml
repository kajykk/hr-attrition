# Promtail 配置（D03 7.1 日志采集 → Loki）
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Docker 容器日志（通过 docker logs）
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        filters:
          - name: name
            values: ["hra"]
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        target_label: container
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream
    pipeline_stages:
      - json:
          expressions:
            level: level
            msg: msg
            tenant_id: tenant_id
      - labels:
          level:
          tenant_id:

  # API 应用日志（若挂载日志文件）
  - job_name: hra-api-logs
    static_configs:
      - targets: ["localhost"]
        labels:
          job: hra-api
          host: localhost
          __path__: /var/log/hra/*.log
